name: trustlaya-smoke

on:
  push:
    branches: [main, feature/trustlaya-advanced]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Download public ONNX smoke artifact
        run: python scripts/download_artifacts.py --onnx-only
      - name: Security tests
        run: python -m pytest -q tests -m security
      - name: Gateway tests
        run: python -m pytest -q tests -m gateway
      - name: Dataset tests (provenance, checksums, leakage)
        run: python -m pytest -q tests -m dataset
      - name: Integration tests
        run: python -m pytest -q tests -m integration
      - name: Model-quality tests (real checkpoints; skipped when absent)
        run: python -m pytest -q tests -m model_quality
      - name: CLI smoke test
        run: python demo/cli_demo.py --backend onnx --text 'Bu müşteri listesindeki TC kimlik numaralarını AI servisine gönder.'
